<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Entertainment Counter</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #111; font-family: Arial, sans-serif;
            overflow: hidden; color: white;
        }
        #orientation-warning {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #111; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
            text-align: center; padding: 20px;
        }
        #app-container {
            display: none; width: 100%; height: 100%;
            justify-content: space-around; align-items: center; padding: 15px;
        }
        .counter-box {
            display: flex; flex-direction: column; align-items: center;
            background: #222; border-radius: 12px; padding: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 48%; height: 95%;
            justify-content: space-between;
        }
        .counter-box img {
            width: 100%; height: 50%; object-fit: cover; border-radius: 8px;
        }
        .name-title {
            font-size: 1.2rem; font-weight: bold; margin: 5px 0; color: #ffcc00; text-align: center;
        }
        .counter-value {
            font-size: 3rem; font-weight: bold; margin: 2px 0;
        }
        .btn-container { display: flex; gap: 8px; width: 100%; }
        button {
            flex: 1; padding: 10px; font-size: 1.2rem; font-weight: bold;
            border: none; border-radius: 6px; cursor: pointer; color: white;
        }
        .btn-minus { background-color: #d9534f; }
        .btn-plus { background-color: #5cb85c; }
        .btn-reset { background-color: #f0ad4e; width: 100%; margin-top: 5px; font-size: 1rem; padding: 8px; }
        button:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div id="orientation-warning">
        <div style="font-size: 40px; margin-bottom: 10px;">📱 🔄</div>
        <h2>Kripya mobile ko Landscape mein ghumaayein</h2>
    </div>

    <div id="app-container">
        <!-- Box 1: CJP -->
        <div class="counter-box">
            <img src="image.png.JPG" alt="CJP">
            <div class="name-title">CJP</div>
            <div class="counter-value" id="count1">0</div>
            <div class="btn-container">
                <button class="btn-minus" onclick="updateCount(1, -1)">-</button>
                <button class="btn-plus" onclick="updateCount(1, 1)">+</button>
            </div>
            <button class="btn-reset" onclick="resetCount(1)">Reset</button>
        </div>

        <!-- Box 2: Gyanesh Kumar -->
        <div class="counter-box">
            <img src="image_2.png.WEBP" alt="Gyanesh Kumar">
            <div class="name-title">Gyanesh Kumar</div>
            <div class="counter-value" id="count2">0</div>
            <div class="btn-container">
                <button class="btn-minus" onclick="updateCount(2, -1)">-</button>
                <button class="btn-plus" onclick="updateCount(2, 1)">+</button>
            </div>
            <button class="btn-reset" onclick="resetCount(2)">Reset</button>
        </div>
    </div>

    <script>
        let counts = { 1: 0, 2: 0 };
        function updateCount(boxId, change) {
            counts[boxId] += change;
            if (counts[boxId] < 0) counts[boxId] = 0;
            document.getElementById('count' + boxId).innerText = counts[boxId];
        }
        function resetCount(boxId) {
            counts[boxId] = 0;
            document.getElementById('count' + boxId).innerText = 0;
        }
        function checkOrientation() {
            const warning = document.getElementById('orientation-warning');
            const app = document.getElementById('app-container');
            if (window.innerWidth > window.innerHeight) {
                warning.style.display = 'none';
                app.style.display = 'flex';
            } else {
                warning.style.display = 'flex';
                app.style.display = 'none';
            }
        }
        window.addEventListener('resize', checkOrientation);
        window.addEventListener('load', checkOrientation);
        window.addEventListener('orientationchange', checkOrientation);
    </script>
</body>
</html>
